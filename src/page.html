<title>Caia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Dites à Caia ce qui coince dans votre commerce : en 2 minutes, l’assistant chiffre l’argent que vous perdez et un conseiller vous rappelle avec la solution. Gratuit, sans engagement.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a conversation first. The welcome is one sentence and a message box; sending it turns the page into a chat with Caia, which asks four quick questions, shows the money at stake, then takes the details for a call back. Black, white, one orange, and green only to confirm. */
:root {
  --ink: #0A0A0B;
  --ink-2: #3A3A40;
  --muted: #6E6E76;
  --dim: #A1A1AA;
  --line: #E8E8EC;
  --bg: #FFFFFF;
  --soft: #F6F6F8;
  --brand: #FF5A1F;
  --brand-deep: #D9420B;
  --brand-soft: #FFF2EB;
  --brand-glow: rgba(255, 90, 31, .22);
  --ok: #12A150;
  --ok-soft: #E8F7EF;
  --err: #C4262A;
  --ui: #0A0A0B; --num: #FF5A1F; --tint: #F6F6F8; --surface: #F6F6F8; --card: #FFFFFF;
  --f: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2.5px solid var(--brand); outline-offset: 3px; }
h1, h2, h3 { font-weight: 700; letter-spacing: -.04em; text-wrap: balance; margin: 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.dim { color: var(--dim); }

/* Wordmark: the dot of the i is the brand */
.logo { display: inline-flex; align-items: baseline; font-weight: 800; font-size: 26px; letter-spacing: -.05em; color: inherit; text-decoration: none; line-height: 1; }
.wmk { white-space: nowrap; }
.idot { position: relative; display: inline-block; }
.idot::after { content: ""; position: absolute; left: 50%; top: .1em; width: .26em; height: .26em; border-radius: 50%; background: var(--brand); transform: translateX(-50%); }

/* Press feedback shared by every button: spring + ripple */
.rp { position: relative; overflow: hidden; isolation: isolate; transition: transform .35s var(--spring), background .2s, color .2s, box-shadow .25s, opacity .2s; }
.rp:active { transform: scale(.95); }
.ripple { position: absolute; border-radius: 50%; pointer-events: none; transform: scale(0); background: currentColor; opacity: .18; animation: ripple .6s var(--ease) forwards; z-index: -1; }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 52px; padding: 0 24px; border-radius: 999px; font-weight: 600; font-size: 16px; white-space: nowrap; text-decoration: none; }
.btn svg { width: 16px; height: 16px; transition: transform .3s var(--spring); }
.btn:hover svg { transform: translateX(3px); }
.btn-dark { background: var(--ink); color: #FFFFFF; }
.btn-dark:hover { background: #26262B; }
.btn-line { box-shadow: inset 0 0 0 1.5px var(--line); }
.btn-line:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }

/* ——— Landing ——— */
.top { position: relative; z-index: 3; }
.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 72px; padding-top: env(safe-area-inset-top, 0px); box-sizing: content-box; }
.top-note { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--muted); }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(18,161,80,.5); animation: pulse 2s infinite; flex: none; }
@keyframes pulse { 70%, 100% { box-shadow: 0 0 0 8px rgba(18,161,80,0); } }
.hero { position: relative; isolation: isolate; padding-block: clamp(40px, 9vh, 110px) 70px; text-align: center; }
.hero::before { content: ""; position: absolute; z-index: -1; left: 50%; top: 52%; width: min(1100px, 140vw); height: 520px; transform: translate(-50%, -50%); background: radial-gradient(50% 50% at 50% 50%, var(--brand-glow), transparent 70%); filter: blur(30px); animation: breathe 7s ease-in-out infinite; pointer-events: none; }
@keyframes breathe { 50% { opacity: .65; transform: translate(-50%, -50%) scale(1.08); } }
.shock { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; font-size: 15px; font-weight: 600; color: var(--ink-2); padding: 7px 16px 7px 7px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 0 0 1px var(--line), 0 8px 24px -16px rgba(10,10,11,.3); margin-bottom: 30px; }
.shock b { color: #FFFFFF; background: var(--brand); padding: 4px 11px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.hero h1 { font-size: clamp(42px, 7vw, 92px); line-height: .96; letter-spacing: -.055em; font-weight: 750; max-width: 12ch; margin: 0 auto; }
.hero .sub { font-size: clamp(17px, 1.6vw, 20px); color: var(--muted); max-width: 34em; margin: 22px auto 0; }

/* The message box: same element in the welcome and the chat */
.composer { view-transition-name: composer; position: relative; width: min(720px, 100%); margin: 38px auto 0; border-radius: 28px; background: #FFFFFF; box-shadow: 0 0 0 1.5px var(--line), 0 24px 60px -28px rgba(10,10,11,.28); transition: box-shadow .3s; text-align: left; }
.composer::before { content: ""; position: absolute; inset: -2px; border-radius: 30px; padding: 2px; background: conic-gradient(from var(--ang, 0deg), transparent 0 62%, var(--brand) 78%, #FFC2A8 86%, transparent 94%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; transition: opacity .3s; animation: spin 3.2s linear infinite; pointer-events: none; }
.composer:focus-within { box-shadow: 0 0 0 1.5px transparent, 0 30px 70px -26px rgba(255, 90, 31, .35); }
.composer:focus-within::before { opacity: 1; }
@property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@keyframes spin { to { --ang: 360deg; } }
.composer textarea, .composer input { display: block; width: 100%; border: 0; outline: 0; resize: none; background: transparent; padding: 22px 76px 22px 24px; font-size: 18px; line-height: 1.45; max-height: 180px; min-height: 72px; }
.composer input { min-height: 68px; }
.composer textarea::placeholder, .composer input::placeholder { color: var(--dim); }
.send { position: absolute; right: 12px; bottom: 12px; width: 48px; height: 48px; border-radius: 50%; background: var(--ink); color: #FFFFFF; display: grid; place-items: center; }
.send:hover { background: var(--brand); }
.send[disabled] { background: #D9D9DE; cursor: default; }
.send svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.send.fly svg { animation: fly .55s var(--ease); }
@keyframes fly { 45% { transform: translate(14px, -14px); opacity: 0; } 46% { transform: translate(-14px, 14px); opacity: 0; } 100% { transform: none; opacity: 1; } }
.ideas { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 18px auto 0; max-width: 760px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px var(--line); font-size: 15px; font-weight: 500; color: var(--ink-2); }
.chip:hover { box-shadow: inset 0 0 0 1.5px var(--ink); color: var(--ink); }
.ideas .chip { animation: chipIn .5s var(--spring) both; animation-delay: calc(var(--i) * 60ms + 300ms); }
@keyframes chipIn { from { opacity: 0; transform: translateY(10px) scale(.92); } }
.micro { margin-top: 16px; font-size: 14px; color: var(--muted); }

/* Numbers */
.nums { padding-block: 30px 90px; }
.nums-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.num { padding: 38px 28px; display: grid; gap: 6px; }
.num + .num { border-left: 1px solid var(--line); }
.num b { font-size: clamp(40px, 5vw, 60px); font-weight: 750; letter-spacing: -.05em; line-height: 1; font-variant-numeric: tabular-nums; }
.num b.o { color: var(--brand); }
.num span { color: var(--muted); font-size: 15px; max-width: 22em; }
.num sup { font-size: .7em; color: var(--dim); }

/* Steps */
.how { padding-block: 40px 110px; }
.how h2, .tools h2 { font-size: clamp(32px, 4.4vw, 54px); line-height: 1; letter-spacing: -.05em; margin-bottom: 40px; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; list-style: none; padding: 0; margin: 0; counter-reset: s; }
.steps li { counter-increment: s; border-radius: 24px; background: var(--soft); padding: 28px; display: grid; gap: 8px; align-content: start; transition: transform .4s var(--spring); }
.steps li:hover { transform: translateY(-4px); }
.steps li::before { content: counter(s); width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--ink); color: #FFFFFF; font-weight: 700; margin-bottom: 8px; }
.steps li:nth-child(2)::before { background: var(--brand); }
.steps b { font-size: 21px; letter-spacing: -.03em; }
.steps span { color: var(--muted); }

/* Tools */
.tools { padding-block: 0 110px; }
.tool-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.tool { border-radius: 22px; box-shadow: inset 0 0 0 1.5px var(--line); padding: 22px; display: grid; gap: 14px; align-content: start; transition: transform .4s var(--spring), box-shadow .25s; }
.tool:hover { transform: translateY(-4px); box-shadow: inset 0 0 0 1.5px var(--ink); }
.tool i { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand-deep); }
.tool:first-child i { background: var(--brand); color: #FFFFFF; }
.tool svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tool b { font-size: 16.5px; letter-spacing: -.02em; line-height: 1.25; }

/* Final call */
.final { text-align: center; padding-block: 100px; background: var(--ink); color: #FFFFFF; border-radius: 36px; margin: 0 max(12px, env(safe-area-inset-left, 0px)) 20px; position: relative; overflow: hidden; isolation: isolate; }
.final::before { content: ""; position: absolute; z-index: -1; left: 50%; bottom: -260px; width: 700px; height: 500px; transform: translateX(-50%); background: radial-gradient(closest-side, rgba(255,90,31,.45), transparent); filter: blur(20px); }
.final h2 { font-size: clamp(38px, 6vw, 76px); line-height: .98; letter-spacing: -.055em; max-width: 13ch; margin: 0 auto 30px; }
.final .btn { background: #FFFFFF; color: var(--ink); }
.final .btn:hover { background: var(--brand); color: #FFFFFF; }

/* Footer */
.site-foot { padding-block: 30px calc(36px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; color: var(--muted); font-size: 13.5px; }
.foot-top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: center; }
.site-foot .logo { font-size: 22px; color: var(--ink); }
.site-foot a { color: inherit; }
.egg { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: text; letter-spacing: inherit; line-height: inherit; }
.egg:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 3px; }
.legal summary { cursor: pointer; text-decoration: underline; text-underline-offset: 3px; width: max-content; max-width: 100%; }
.legal-body { display: grid; gap: 10px; margin-top: 12px; max-width: 75ch; }
.legal-body p { margin: 0; }

[data-reveal].in { animation: reveal .8s var(--ease) both; animation-delay: calc(var(--d, 0) * 90ms); }
@keyframes reveal { from { opacity: 0; transform: translateY(26px); } }
.hero .shock, .hero h1, .hero .sub { animation: reveal .9s var(--ease) both; }
.hero h1 { animation-delay: .07s; } .hero .sub { animation-delay: .14s; }
.hero .composer { animation: rise .9s .2s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(30px) scale(.98); } }

/* ——— Chat ——— */
.chat { min-height: 100%; display: grid; grid-template-rows: auto 1fr; }
.chat-head { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.88); backdrop-filter: saturate(1.8) blur(18px); -webkit-backdrop-filter: saturate(1.8) blur(18px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.chat-head .wrap { display: flex; align-items: center; justify-content: space-between; gap: 14px; height: 62px; max-width: 760px; }
.who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.av { width: 36px; height: 36px; border-radius: 50%; background: var(--ink); color: #FFFFFF; display: grid; place-items: center; font-weight: 800; font-size: 18px; letter-spacing: -.05em; position: relative; flex: none; }
.av::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 2.5px #FFFFFF; }
.who b { display: block; font-size: 15.5px; letter-spacing: -.02em; }
.who div span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head-acts { display: flex; gap: 4px; }
.ghost { font-size: 14px; font-weight: 600; color: var(--muted); padding: 8px 12px; border-radius: 999px; }
.ghost:hover { color: var(--ink); background: var(--soft); }
.prog { height: 2px; background: var(--line); }
.prog i { display: block; height: 100%; width: var(--p, 0%); background: var(--brand); transition: width .6s var(--ease); }
.thread { width: min(720px, 100%); margin: 0 auto; padding: 28px max(20px, env(safe-area-inset-right, 0px)) 220px max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 86%; display: flex; gap: 10px; align-items: flex-end; }
.msg.bot { align-self: flex-start; }
.msg.me { align-self: flex-end; }
.msg .mini { width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #FFFFFF; display: grid; place-items: center; font-size: 14px; font-weight: 800; flex: none; }
.msg.cont .mini { visibility: hidden; }
.bub { padding: 12px 16px; border-radius: 22px; font-size: 16.5px; line-height: 1.45; overflow-wrap: anywhere; }
.bot .bub { background: var(--soft); border-bottom-left-radius: 7px; }
.me .bub { background: var(--ink); color: #FFFFFF; border-bottom-right-radius: 7px; }
.msg.new.bot { animation: inL .5s var(--spring) both; }
.msg.new.me { animation: inR .5s var(--spring) both; }
@keyframes inL { from { opacity: 0; transform: translate(-12px, 10px) scale(.94); } }
@keyframes inR { from { opacity: 0; transform: translate(12px, 10px) scale(.94); transform-origin: right bottom; } }
.w { opacity: 0; animation: wIn .3s ease forwards; }
@keyframes wIn { to { opacity: 1; } }
.typing .bub { display: inline-flex; gap: 5px; padding: 16px 18px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); animation: bounce 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }
.thinking .bub { background: linear-gradient(90deg, var(--soft) 0%, #FFFFFF 50%, var(--soft) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; color: var(--muted); font-weight: 500; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* Diagnostic card in the thread */
.diag { align-self: stretch; max-width: none; margin: 6px 0 6px 38px; border-radius: 26px; background: var(--ink); color: #FFFFFF; padding: 26px; display: grid; gap: 18px; position: relative; overflow: hidden; isolation: isolate; }
.diag::before { content: ""; position: absolute; z-index: -1; right: -120px; top: -140px; width: 360px; height: 360px; background: radial-gradient(closest-side, rgba(255,90,31,.4), transparent); }
.diag.new { animation: pop .7s var(--spring) both; }
@keyframes pop { from { opacity: 0; transform: translateY(16px) scale(.96); } }
.diag small { font-size: 13.5px; color: #A9A9B2; font-weight: 500; }
.diag .big { font-size: clamp(52px, 9vw, 80px); font-weight: 800; letter-spacing: -.06em; line-height: .95; color: var(--brand); font-variant-numeric: tabular-nums; }
.diag .big em { font-style: normal; font-size: 18px; letter-spacing: -.01em; color: #FFFFFF; font-weight: 600; margin-left: 6px; }
.diag .yr { color: #A9A9B2; font-size: 15px; } .diag .yr b { color: #FFFFFF; }
.leaks { display: grid; gap: 12px; border-top: 1px solid #2A2A30; padding-top: 16px; }
.leak { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; font-size: 15px; }
.leak b { font-variant-numeric: tabular-nums; }
.leak .ln { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: #2A2A30; overflow: hidden; }
.leak .ln i { display: block; height: 100%; width: 0; background: var(--brand); border-radius: inherit; transition: width 1s var(--ease); }
.recos { display: flex; flex-wrap: wrap; gap: 8px; }
.recos span { font-size: 13.5px; font-weight: 600; padding: 7px 12px; border-radius: 999px; background: #1E1E23; box-shadow: inset 0 0 0 1px #33333A; }
.recos span:first-child { background: var(--brand); box-shadow: none; }
.diag p { margin: 0; color: #D4D4DA; font-size: 15.5px; }
.diag .hyp { font-size: 12.5px; color: #8A8A93; }

/* Done card */
.done { align-self: stretch; margin: 6px 0 6px 38px; border-radius: 26px; background: var(--ok-soft); padding: 26px; display: grid; gap: 10px; animation: pop .7s var(--spring) both; }
.done svg { width: 52px; height: 52px; }
.done circle { fill: var(--ok); }
.done path { stroke: #FFFFFF; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .5s .3s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.done b { font-size: 22px; letter-spacing: -.03em; }
.done span { color: var(--ink-2); }

/* Bottom dock: suggested answers + message box */
.dock { position: fixed; inset: auto 0 0; z-index: 6; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, #FFFFFF 70%, rgba(255,255,255,0)); }
.dock .composer { margin: 0 auto; width: min(720px, 100%); }
.dock .composer textarea, .dock .composer input { padding-block: 18px; min-height: 62px; font-size: 17px; }
.dock .send { bottom: 8px; right: 8px; width: 46px; height: 46px; }
.answers { width: min(720px, 100%); margin: 0 auto 10px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.answers .chip { animation: chipIn .45s var(--spring) both; animation-delay: calc(var(--i) * 55ms); }
.answers .chip.hot { background: var(--ink); color: #FFFFFF; box-shadow: none; }
.answers .chip.hot:hover { background: var(--brand); }
.chip.picked { animation: picked .35s var(--ease) forwards !important; }
@keyframes picked { to { transform: translateY(-30px) scale(.9); opacity: 0; } }
.legal-line { width: min(720px, 100%); margin: 8px auto 0; font-size: 12.5px; color: var(--muted); text-align: center; }
.fielderr { width: min(720px, 100%); margin: 0 auto 8px; color: var(--err); font-size: 14px; font-weight: 600; text-align: right; }
.composer.shake { animation: shake .4s ease; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.note { font-size: 13.5px; color: var(--muted); text-align: center; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }

::view-transition-old(root), ::view-transition-new(root) { animation-duration: .45s; }
::view-transition-group(composer) { animation-duration: .55s; animation-timing-function: cubic-bezier(.2,.8,.2,1); }

[hidden] { display: none !important; }
@media (max-width: 860px) {
  .tool-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .steps { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .top-note { display: none; }
  .hero { padding-top: 24px; }
  .shock { font-size: 13.5px; border-radius: 20px; padding: 8px 14px 8px 8px; text-align: left; flex-wrap: nowrap; }
  .nums-grid { grid-template-columns: minmax(0, 1fr); }
  .num + .num { border-left: 0; border-top: 1px solid var(--line); }
  .num { padding: 26px 4px; }
  .tool-row { grid-template-columns: minmax(0, 1fr); }
  .final { border-radius: 28px; margin-inline: 8px; padding-block: 70px; }
  .composer textarea { font-size: 17px; padding: 18px 68px 18px 20px; }
  .msg { max-width: 92%; }
  .diag, .done { margin-left: 0; padding: 22px; }
  .answers { justify-content: flex-start; }
  .who div span { display: none; }
  .ghost { padding: 8px 9px; font-size: 13.5px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

async function answer(v) {
  if (busy) return; busy = true;
  const st = S.step, A = S.A;
  let err = null;
  try {
    if (st === 'problem') {
      A.probleme = v.slice(0, 1000); me(v); dockOff();
      const ack = (await ai('reply', { message: A.probleme })) || ackFor(A.probleme);
      await say(ack);
      await say('Quelques questions rapides pour chiffrer tout ça. Votre commerce, c’est plutôt :', { wait: 300 });
      S.step = 'cat';
    } else if (st === 'cat') {
      if (!CATS.some(c => c[0] === v)) return;
      A.cat = v; S.step = 'type'; // the choice only opens the list, no message
    } else if (st === 'type') {
      const t = ALL_TYPES.find(x => x[0] === v); if (!t) return;
      A.type = t[0]; A.profil = t[1]; A.panier = t[2]; A.q = {}; S.qi = 0; me(v); dockOff();
      await say(PROFILES[A.profil].intro);
      await say(curQ().ask(A.profil), { wait: 300 });
      S.step = 'q';
    } else if (st === 'q') {
      const qid = PROFILES[A.profil].qs[S.qi], Q = QS[qid], o = Q.opts.find(x => x[0] === v); if (!o) return;
      A.q[qid] = o[1]; me(v); dockOff();
      const r = Q.react(o[1]);
      if (S.qi < PROFILES[A.profil].qs.length - 1) {
        S.qi += 1; save();
        if (r) await say(r);
        await say(curQ().ask(A.profil), { wait: r ? 250 : 500 });
      } else {
        if (r) await say(r);
        await diagnose();
        S.step = 'consent';
      }
    } else if (st === 'consent' || st === 'later') {
      me(v); dockOff();
      if (v === 'Pas maintenant') { await say('Pas de souci. Votre estimation reste ici si vous changez d’avis.'); S.step = 'later'; }
      else { await say('Parfait. C’est à quel prénom ?', { wait: 350 }); S.step = 'prenom'; }
    } else if (st === 'prenom') {
      A.prenom = v.slice(0, 60); me(v); dockOff();
      await say(`Enchanté, ${A.prenom}. Le nom de votre commerce ?`, { wait: 350 }); S.step = 'commerce';
    } else if (st === 'commerce') {
      A.commerce = v.slice(0, 80); me(v); dockOff();
      await say('Dans quelle ville ?', { wait: 300 }); S.step = 'ville';
    } else if (st === 'ville') {
      A.ville = v.slice(0, 60); me(v); dockOff();
      await say('Et le meilleur numéro pour vous joindre ?', { wait: 300 }); S.step = 'tel';
    } else if (st === 'tel') {
      const tel = normPhone(v);
      if (!tel) { err = 'Ce numéro semble incomplet. Exemple : 06 12 34 56 78'; return; }
      A.telephone = tel; me(tel); dockOff();
      await say('On vous appelle plutôt quand ?', { wait: 300 }); S.step = 'slot';
    } else if (st === 'slot' || st === 'retry') {
      if (st === 'slot') A.creneau = v;
      me(v); dockOff();
      const th = await thinking('Envoi de votre demande…', 300);
      const ok = await submit();
      await th.done();
      if (!ok) { await say('La demande n’est pas partie. Vérifiez votre connexion, puis réessayez : rien n’est perdu.'); S.step = 'retry'; }
      else {
        const when = callWhen(), slot = A.creneau && A.creneau !== 'Peu importe' ? `, plutôt ${A.creneau.toLowerCase()}` : '';
        const msg = { r: 'bot', k: 'done', t: `C’est noté, ${A.prenom}.`, sub: `Un conseiller vous appelle ${when}${slot}, au ${A.telephone}, avec une proposition pour ${A.commerce}.${LIVE || DB ? '' : ' (Aperçu : rien n’est envoyé.)'}` };
        S.msgs.push(msg); S.step = 'done'; save();
        $('#thread').appendChild(msgEl(msg, true)); scrollEnd(); confetti();
      }
    }
  } finally {
    busy = false; save(); progress(); if (S.view === 'chat') dock(err);
  }
}

function animateDiag(el, total) {

/* ——— Confetti in brand colours ——— */
function confetti() {
  if (reduce) return;
  const c = document.getElementById('fx'), g = c.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ['#FF5A1F', '#0A0A0B', '#FFC2A8', '#12A150'], P = Array.from({ length: 140 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .62, vx: (Math.random() - .5) * 14, vy: -Math.random() * 15 - 6, r: Math.random() * 6.28, vr: (Math.random() - .5) * .3, w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, c: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  const step = t => { const k = (t - t0) / 1000; g.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach(p => { p.vy += .45; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; g.save(); g.globalAlpha = Math.max(0, 1 - Math.max(0, k - 1.4) / .8); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore(); });
    if (k < 2.3) requestAnimationFrame(step); else g.clearRect(0, 0, innerWidth, innerHeight); };
  requestAnimationFrame(step);
}

  /* ——— Analysis ——— */
  function money(d) {
    // New requests carry the exact lines shown to the shop owner; older ones are rebuilt from the raw answers.
    let det = d.detail; if (typeof det === 'string') { try { det = JSON.parse(det); } catch { det = null; } }
    if (det && Array.isArray(det.items)) {
      const items = det.items.map(i => ({ label: String(i.label || ''), v: Number(i.v) || 0 })).sort((x, y) => y.v - x.v);
      return { items, total: items.reduce((t, i) => t + i.v, 0), has: items.length > 0, reponses: det.reponses || {} };
    }
    const n = k => Number(d[k]) || 0;
    const items = [
      { label: 'Appels manqués', v: n('appels') * 4.33 / 3 * n('panier') },
      { label: 'Commissions des plateformes', v: n('plateformes') * n('panier') * 0.30 * 0.30 },
      { label: 'Clients qui ne reviennent pas', v: n('clients') * 0.05 * n('panier') },
    ].sort((x, y) => y.v - x.v);
    return { items, total: items.reduce((t, i) => t + i.v, 0), has: n('panier') > 0, reponses: {} };
  }
  const QLABEL = { calls: 'Appels manqués par semaine', platforms: 'Commandes en plateforme par mois', noshow: 'Rendez-vous non honorés par semaine', clients: 'Clients différents par mois', visits: 'Clients par jour', loyalty: 'Fidélité aujourd’hui', google: 'Présence sur Google' };
  const keysOf = d => String(d.pistes || '').split(',').map(s => s.trim()).filter(k => PRODUITS[k]);
  const has = (d, txt) => String(d.soucis || '').includes(txt) || String(d.deja_en_place || '').includes(txt);
  function analyse(d) {
    const m = money(d), why = [];
    let s = Math.min((m.has ? m.total : Number(d.estimation_mois) || 0) / 1500, 1) * 40;
    why.push(`Pertes estimées : ${euro(m.has ? m.total : d.estimation_mois)} par mois`);
    const urg = { 'Le plus vite possible': 30, 'Dans le mois': 18, 'Pas pressé, je me renseigne': 6 }[d.delai] ?? 10;
    s += urg; why.push(`Délai : ${d.delai || 'non précisé'}`);
    const nbSoucis = String(d.soucis || '').split('|').filter(x => x.trim()).length + (String(d.probleme || '').trim() ? 1 : 0);
    s += Math.min(nbSoucis, 3) * 6; why.push(`${nbSoucis} problème${nbSoucis > 1 ? 's' : ''} exprimé${nbSoucis > 1 ? 's' : ''}`);
    if (Number(d.plateformes) > 0) { s += 6; why.push('Utilise déjà une plateforme de livraison'); }
    if (String(d.probleme || '').trim().length > 30) { s += 4; why.push('A pris le temps de décrire son problème'); }
    const score = Math.max(0, Math.min(100, Math.round(s)));
    const temp = score >= 65 ? ['Chaud', 'p-hot', 'var(--hot)'] : score >= 40 ? ['Tiède', 'p-warm', 'var(--warm)'] : ['Froid', 'p-cold', 'var(--cold)'];
    const offer = keysOf(d).length ? keysOf(d) : ['google', 'fidelite'];
    const cost = offer.reduce((a, k) => a + (PRIX[k] || 0), 0);
    const gain = m.has ? m.total : Number(d.estimation_mois) || 0;
    const objections = [
      ['« C’est trop cher. »', `On parle de ${euro(cost)} par mois pour environ ${euro(gain)} récupérés selon ses propres chiffres. Proposer de mesurer ensemble après un mois.`],
    ];
    if (Number(d.plateformes) > 0) objections.push(['« Uber Eats m’amène des clients. »', 'On ne lui demande pas de quitter Uber. Uber pour les nouveaux clients, sa propre page pour les habitués, qui ne coûtent plus de commission.']);
    if (has(d, 'Rien de tout ça') || d.type_commerce === 'Boulangerie ou pâtisserie') objections.push(['« Je ne suis pas à l’aise avec l’informatique. »', 'On installe tout et on lui montre en dix minutes. Il n’a rien à configurer.']);
    if (d.delai === 'Pas pressé, je me renseigne') objections.push(['« Je n’ai pas le temps en ce moment. »', `Chaque mois d’attente coûte environ ${euro(gain)}. L’installation prend moins d’une heure de son temps.`]);
    if (has(d, 'Une carte de fidélité')) objections.push(['« J’ai déjà une carte de fidélité. »', 'La carte papier se perd et ne relance personne. La version téléphone fait revenir les clients qui tardent.']);
    objections.push(['« Je vais réfléchir. »', 'Demander ce qui le fait hésiter, puis proposer un essai sur un mois avec un point chiffré à la fin.']);
    return { m, score, temp, why, offer, cost, gain, objections };
  }

  /* ——— Call script ——— */
  function script(d, a) {

    const offerTxt = a.offer.map(k => PRODUITS[k].charAt(0).toLowerCase() + PRODUITS[k].slice(1)).join(', ');
    const ratio = a.cost ? Math.max(1, Math.round(a.gain / a.cost)) : 0;
    return [
      ['Ouverture', [`« Bonjour ${P}, c’est [votre prénom] de Caia. Vous avez fait le diagnostic pour ${d.commerce || 'votre commerce'} ${ago(d.created_at)}. Vous avez deux minutes, ou je vous rappelle ${String(d.creneau || '').toLowerCase() !== 'peu importe' && d.creneau ? String(d.creneau).toLowerCase() : 'plus tard'} ? »`]],
      ['Ce qu’il nous a dit', soucis.length || d.probleme || Object.keys(a.m.reponses).length ? [...(d.probleme ? [`En ses mots : « ${d.probleme} »`] : soucis.map(x => `« ${x} »`)), ...Object.entries(a.m.reponses).filter(([, v]) => v).map(([k, v]) => `${QLABEL[k] || k} : ${v}`)] : ['Pas de problème précis : commencer par les questions de découverte.']],

        Number(d.plateformes) > 0 ? `Sur vos ${d.plateformes} commandes par mois en plateforme, combien sont des habitués ?` : 'Comment vos clients vous trouvent-ils aujourd’hui ?',

      ]],

      ['Proposition', [`« Ce que je vous propose : ${offerTxt}. On installe tout, vous n’avez rien à configurer. C’est ${euro(a.cost)} par mois${ratio > 1 ? `, et vous pourriez récupérer environ ${ratio} fois plus` : ''}. »`]],
      ['Objections probables', a.objections.map(([q, r]) => `${q} → ${r}`)],
      ['Conclusion', [`« Je vous propose de passer tout installer ${d.delai === 'Le plus vite possible' ? 'cette semaine' : 'dans les prochains jours'}. Plutôt ${d.creneau && d.creneau !== 'Peu importe' ? String(d.creneau).toLowerCase() : 'le matin ou l’après-midi'} ? Je vous envoie le récapitulatif et le prix par écrit${d.email ? ` à ${d.email}` : ' par SMS'}. »`]],
    ];
  }

          <div class="d-acts">${tel ? `<a class="btn btn-ui" href="tel:${esc(tel)}">${icon(I.phone)}${esc(d.telephone)}</a><button class="btn btn-line" id="cp" title="Copier le numéro">${icon(I.copy)}</button>` : ''}
            <select id="st" aria-label="Statut">${STATUTS.map(([k, l]) => `<option value="${k}"${d.statut === k ? ' selected' : ''}>${l}</option>`).join('')}</select></div></div>
        <p class="hint">À appeler : ${esc(d.creneau || 'peu importe')} ${d.delai ? ` · Délai souhaité : ${esc(d.delai)}` : ''}</p>
      </div>
      <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-t="${k}" aria-selected="${tab === k}">${l}</button>`).join('')}</div>
      <div class="panel" role="tabpanel">${panel(d, a)}</div>`;
    $('#bk').addEventListener('click', () => { sel = null; paintList(); paintDetail(); });
    if ($('#cp')) $('#cp').addEventListener('click', () => copy(d.telephone));
    $('#st').addEventListener('change', e => save(d, { statut: e.target.value }, 'Statut enregistré'));
    host.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => { tab = b.dataset.t; paintDetail(); }));
    host.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => copy(b.closest('[data-src]').querySelector('pre, .src').innerText)));
    const nt = host.querySelector('#nt');
    if (nt) { let t; nt.addEventListener('input', () => { const sv0 = $('#sv'); if (sv0) sv0.textContent = 'Modifications en cours…'; clearTimeout(t); t = setTimeout(() => save(d, { notes: nt.value }, null).then(ok => { const sv = $('#sv'); if (sv) sv.textContent = ok ? 'Enregistré' : 'Non enregistré, vérifiez la connexion'; }), 700); }); }
  }
  function panel(d, a) {
    if (tab === 'analyse') {
      const max = Math.max(1, ...a.m.items.map(i => i.v));
      const bar = (l, v) => `<div class="b-row"><div class="b-top"><span>${l}</span><b>${euro(v)}</b></div><div class="track"><i style="width:${(v / max * 100).toFixed(1)}%"></i></div></div>`;
      const ratio = a.cost ? a.gain / a.cost : 0, payback = a.gain > 0 ? Math.ceil(a.cost / (a.gain / 30)) : null;
      return `<div class="grid2">
        <div class="box"><h3>Priorité</h3><div class="score"><div class="ring" style="--v:${a.score};--c:${a.temp[2]}"><b>${a.score}</b></div><div><span class="pill ${a.temp[1]}">${a.temp[0]}</span><ul class="why" style="margin-top:8px">${a.why.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div></div></div>
        <div class="box"><h3>Ce qu’il perd chaque mois</h3>${a.m.has ? `<div class="bars">${a.m.items.map(i => bar(esc(i.label), i.v)).join('')}</div>` : '<p class="hint">Pas de chiffres du calculateur pour cette demande.</p>'}<div class="total"><span>Total estimé</span><b>${euro(a.gain)}</b></div></div>
      </div>
      <div class="grid2">
        <div class="box"><h3>Offre à proposer</h3><table class="offer"><tbody>${a.offer.map(k => `<tr><td>${esc(PRODUITS[k])}</td><td>${euro(PRIX[k])} / mois</td></tr>`).join('')}<tr><td><b>Total</b></td><td>${euro(a.cost)} / mois</td></tr></tbody></table>
          <p class="roi">Pour ${euro(a.cost)} par mois, il peut récupérer environ <b>${euro(a.gain)}</b>${ratio >= 1 ? `, soit <b>${ratio.toFixed(1).replace('.', ',')} fois</b> sa mise` : ''}.${payback ? ` Remboursé en <b>${payback} jour${payback > 1 ? 's' : ''}</b> environ.` : ''}</p>
          <p class="hint">Prix modifiables dans le fichier index.html, à la ligne « const PRIX ».</p></div>
        <div class="box"><h3>Objections probables</h3><div class="obj">${a.objections.map(([o, r]) => `<div><b>${esc(o)}</b><span>${esc(r)}</span></div>`).join('')}</div></div>
      </div>
      <div class="box"><h3>Ce qu’il a dit</h3><dl class="facts"><dt>Problèmes</dt><dd>${esc(String(d.soucis || '—').split('|').join(' · '))}</dd><dt>En ses mots</dt><dd>${esc(d.probleme || '—')}</dd><dt>Déjà en place</dt><dd>${esc(d.deja_en_place || '—')}</dd><dt>Ses chiffres</dt><dd>${esc(`${d.appels ?? '?'} appels manqués / semaine · panier ${d.panier ?? '?'} € · ${d.plateformes ?? '?'} commandes plateformes / mois · ${d.clients ?? '?'} clients / mois`)}</dd></dl></div>`;
    }
    if (tab === 'script') {
      const s = script(d, a);
      const txt = s.map(([h, lines]) => `${h.toUpperCase()}\n${lines.map(l => '- ' + l).join('\n')}`).join('\n\n');
      return `<div class="prompt" data-src><div class="prompt-head"><span>Script personnalisé, à garder sous les yeux pendant l’appel.</span><button class="btn btn-line" data-copy>${icon(I.copy)}Copier le script</button></div>
        <div class="script">${s.map(([h, lines], i) => `<section><h4>${esc(h)}</h4>${lines.length === 1 && i !== 2 ? `<p class="say">${esc(lines[0])}</p>` : `<ul>${lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>`}</section>`).join('')}</div>
        <pre class="src" hidden>${esc(txt)}</pre></div>`;
    }
    if (tab === 'prompts') {
      return `<p class="hint">Chaque prompt est déjà rempli avec les informations de ce commerce. Copiez-le dans Claude ou un autre assistant IA.</p>` + prompts(d, a).map(([t, sub, body0]) => { const body = body0.replace(/^ {2}/gm, ''); return `<div class="prompt" data-src><div class="prompt-head"><div><h3>${esc(t)}</h3><span>${esc(sub)}</span></div><button class="btn btn-line" data-copy>${icon(I.copy)}Copier</button></div><pre>${esc(body)}</pre></div>`; }).join('');
    }
    if (tab === 'notes') {
      return `<div class="notes"><textarea id="nt" placeholder="Ce qu’il a dit au téléphone, prochaine étape, date de rappel…">${esc(d.notes || '')}</textarea><p class="saved" id="sv">Enregistrement automatique</p></div>`;
    }
    const fields = [['Reçue le', new Date(d.created_at).toLocaleString('fr-FR')], ['Prénom', d.prenom], ['Nom', d.nom], ['Commerce', d.commerce], ['Ville', d.ville], ['Type', d.type_commerce], ['Téléphone', d.telephone], ['E-mail', d.email], ['Créneau', d.creneau], ['Délai', d.delai], ['Problèmes', d.soucis], ['En ses mots', d.probleme], ['Déjà en place', d.deja_en_place], ['Pistes suggérées', keysOf(d).map(k => PRODUITS[k]).join(', ')], ['Estimation envoyée', euro(d.estimation_mois)], ['Appels manqués / semaine', d.appels], ['Panier moyen', d.panier != null ? d.panier + ' €' : ''], ['Commandes plateformes / mois', d.plateformes], ['Clients / mois', d.clients]];
    return `<dl class="facts">${fields.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v === '' || v == null ? '—' : v)}</dd>`).join('')}</dl>`;
  }
  async function save(d, patch, msg) {
    const before = { ...d };
    Object.assign(d, patch);
    if (demo) {
      const key = patch.statut != null ? 'caia-demo-statut' : 'caia-demo-notes', m = store.get(key) || {};
      m[d.id] = patch.statut != null ? patch.statut : patch.notes; store.set(key, m);
    } else {
      try { await api('demandes?id=eq.' + encodeURIComponent(d.id), { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(patch) }); }
      catch (e) { Object.assign(d, before); toast('Non enregistré, vérifiez la connexion'); paintKpis(); paintList(); return false; }
    }
    if (msg) toast(msg);
    paintKpis(); paintList();
    return true;
  }
  function exportCsv() {
    const cols = ['created_at', 'statut', 'commerce', 'prenom', 'nom', 'ville', 'telephone', 'email', 'type_commerce', 'creneau', 'delai', 'soucis', 'probleme', 'deja_en_place', 'estimation_mois', 'appels', 'panier', 'plateformes', 'clients', 'notes'];
    const cell = v => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const csv = '﻿' + [cols.join(';'), ...visible().map(r => cols.map(c => cell(r[c])).join(';'))].join('\n');
    try {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'demandes-caia.csv';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      toast('Export lancé');
    } catch (e) { toast('Export impossible ici'); }
  }

  /* ——— Boot ——— */
  (async () => {
    if (DB && session && session.token) { try { await load(); shell(); return; } catch (e) { store.del(SKEY); session = null; } }
    loginView();
  })();
}
let teamClose = null;

try { history.replaceState({ view }, ''); } catch (e) {}
render(false);
if (location.hash === '#equipe') openTeam();
addEventListener('hashchange', () => { if (location.hash === '#equipe') openTeam(); });
})();
</script>
